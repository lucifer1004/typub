[project]
name = "typub"
# Default owner for new RFCs (uses git user.name if not set)
default_owner = "@lucifer1004"

[paths]
gov_root = "gov"
docs_output = "docs"
agent_dir = ".agents"

[schema]
version = 2

[source_scan]
enabled = true
include = ["src/**/*.rs", "tests/**/*.rs", "gov/**/*.toml", "gov/**/*.json"]
exclude = []
