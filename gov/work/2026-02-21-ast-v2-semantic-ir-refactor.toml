[govctl]
schema = 1
id = "WI-2026-02-21-004"
title = "ast v2 semantic ir refactor"
status = "done"
created = "2026-02-21"
started = "2026-02-21"
refs = [
    "RFC-0009",
    "ADR-0013",
]

[content]
description = '''
Big-bang AST/IR v2 migration implementation plan:

Step 1: Introduce v2 semantic IR type surface as the only core conformance model (`Document` root, `Block`/`Inline`, typed attrs + passthrough, asset index, footnotes, math payload).
Step 2: Replace parser output to emit v2 IR directly and remove legacy shape production (`HtmlElement`/`InlineFragment`/`ImageMarker`).
Step 3: Replace shared transform/validation pipeline to operate on v2 IR only; enforce deterministic ordering and v2 invariants.
Step 4: Refactor adapter boundary (`typub-adapters-core`) and all first-party adapters to consume v2 IR without legacy bridge layers.
Step 5: Remove legacy AST types, fallback conversion paths, and dead helper utilities; update tests/fixtures to v2 baseline.
Step 6: Run governance + test gates and finalize implementation notes for maintainability.

Progress update (2026-02-21, typub-html):
- v2 parse + serialize paths are now active in `typub-html` and covered by crate tests.
- Deterministic coverage was extended for passthrough attrs ordering (`BTreeMap`) and style-set canonical order behavior.
- Recent parse/serialize bug fixes completed:
  - fixed footnote container over-consume behavior (only consume when actual `fn-*` entries are extracted),
  - tightened `sup` -> `FootnoteRef` conversion to strict shape matching,
  - removed duplicate class emission in math PNG serialization,
  - prevented duplicate footnote backlink emission,
  - switched admonition class detection to token-aware matching to avoid `footnotes` false positives.

Progress update (2026-02-21, typub-markdown):
- Migrated renderer tests from v1 element fixtures to v2 `Document` fixtures with strict `assert_eq!` expectations.
- Fixed renderer correctness issues from review:
  - footnote references now use `NodeFootnoteReference` and align with `NodeFootnoteDefinition(name="fn:{id}")`,
  - inline HTML style wrappers preserve nested inline structure by recursive rendering instead of text flattening,
  - ordered-list semantics (`reversed`, non-decimal marker style, per-item value override) preserve behavior via HTML fallback when CommonMark cannot represent semantics,
  - asset variant URL resolution now prefers `original` variant first (aligned with `typub-html` serializer),
  - enabled comrak footnote/tasklist extensions in markdown formatter path.
- Verified with `cargo test -p typub-markdown` (all tests passing locally).

Next execution design (v2-native, not 1:1 port):
- Build a pass-based v2 pipeline with explicit `Document` passes and sidecar-only execution context.
- Add shared walker/visitor utilities for `Block`/`Inline`/`Asset` traversal.
- Port legacy capabilities (link rewrite, math enrich, validation) as v2 passes rather than legacy-API migration.


Progress update (2026-02-22, adapter migration + quality gates):
- Completed v2 migration follow-ups for confluence/notion adapter paths and fixed remaining reference errors after blocks_v2->blocks and format_v2->format rename transitions.
- Fixed engine-side v2 test mismatches (Document payload shape, unresolved asset guard assertions, and renderer test import path).
- Fixed markdown table regression by rendering simple tables through comrak table AST nodes (pipe table output restored for markdown profiles) while keeping HTML preview side on v2 semantic table structure (`thead`/`tbody`).
- Verified gates in workspace after fixes: `cargo test -p typub-engine`, `cargo test -p typub-markdown`, `cargo test -p typub --test preview_snapshots`, `cargo clippy --workspace -- -D warnings`, and `govctl check` all pass.
- Elements naming legacy retained for follow-up cleanup: public compatibility alias `HtmlElement = Document` remains in engine exports, and some pipeline comments still mention `ImageMarker` terminology.


Progress update (2026-02-22, runtime-path v1 naming cleanup):
- Completed runtime-path naming cleanup from v1 terminology to v2 semantics across adapters-core/engine/adapters: `payload.elements -> payload.document`, markdown exports switched to `document_to_markdown*`, and pending-asset helpers switched to `build_pending_asset_list_from_document*`.
- Removed engine compatibility export alias `HtmlElement` and updated integration test usage to `Document`.
- Notion v2 conversion entrypoint renamed from `elements_to_blocks` to `document_to_blocks`.
- Verified gates after rename cleanup: `cargo check` (affected crates), `cargo clippy --workspace -- -D warnings`, `cargo test -p typub-adapters-core -p typub-engine --lib`, and `cargo test -p typub --test preview_snapshots`.
- Deferred scope by agreement: non-exported legacy modules under `typub-html` remain untouched for a later concentrated cleanup pass.

Progress update (2026-02-22, parser flow + codeblock semantics hardening):
- Fixed table/container flow parsing at the source: block-child dispatch now shares a flow-content splitter that treats phrasing tags as inline runs, preventing table-cell inline tags (`strong`/`em`/`a`/math inline span) from being misclassified as UnknownBlock in WeChat preview.
- Unified tag classification to reuse `parse/spec.rs::is_phrasing_content_tag` instead of introducing a duplicate tag list, so list parsing and container parsing stay consistent.
- Fixed Confluence codeblock newline loss from source parsing: `<pre><code>` extraction now walks DOM nodes and only maps real `<br>` elements to `\n`, preserving literal escaped code text like `&lt;br&gt;` without false replacement.
- Added regression coverage for both issues: table-cell inline formatting preservation, codeblock `<br>` newline preservation, literal `<br>` text preservation, and Confluence CDATA newline retention.
- Verified gates for touched packages: `cargo test -p typub-html`, `cargo test -p typub-adapter-confluence`, and `cargo clippy -p typub-html -p typub-adapter-confluence -- -D warnings`.

Progress update (2026-02-22, notion/confluence image caption semantics):
- Updated cmarker image marker mode to emit raw <img> placeholders instead of [[IMG:...]] code markers, keeping asset-source metadata in HTML path.
- Notion block mapping now uses image.caption only (figcaption > alt fallback) and omits unsupported image.alt payload field.
- Confluence formatter now maps single-image figure caption to <ac:caption> under <ac:image> while keeping alt in ac:alt.
- Updated Notion/Confluence platform docs and markdown test fixture accordingly.'''

