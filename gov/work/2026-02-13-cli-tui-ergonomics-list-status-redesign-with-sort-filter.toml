[govctl]
id = "WI-2026-02-13-009"
title = "CLI/TUI ergonomics: list/status redesign with sort/filter"
status = "done"
created = "2026-02-13"
started = "2026-02-13"
completed = "2026-02-13"

[content]
description = """
Improve CLI/TUI ergonomics by differentiating list and status commands:
- list: compact table view with sort/filter/limit options
- status: single-post detailed view (path required)
- TUI: interactive sort cycling with s/S keys
- Command aliases for common commands (ls, pub, b, w)
- Short flags for frequently used options
- Improved help text with examples
- Adaptive compact platform display (short codes when table exceeds terminal width)"""

