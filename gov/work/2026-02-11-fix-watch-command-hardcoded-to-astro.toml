[content]
description = 'The watch command (watcher.rs) is hardcoded to rebuild only for the astro adapter (registry.get("astro")). Users working with any other platform get no useful rebuilds from watch mode. Fix: accept a --platform flag (matching build/preview/publish) and fall back to default_platforms() when unspecified.'

[[content.acceptance_criteria]]
text = "watch command respects --platform flag and falls back to default platforms"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "watch rebuilds for each target platform, not just astro"
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "govctl check passes"
