[content]
description = "Complete redesign of the Content Intermediate Representation model to support nested lists, task lists, definition lists, enhanced table cells, and new inline fragments. This is a breaking change that migrates BulletList/NumberedList from flat Vec<Vec<InlineFragment>> to recursive ListItem structure."

