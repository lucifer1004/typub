#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SHARED-TYPES"
title = "Shared Adapter Types Crate"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
A new crate `typub-adapters-core` MUST be created to hold shared adapter abstractions.

This crate MUST export:
- `PlatformAdapter` trait (moved from `src/adapters/mod.rs`)
- `AdapterPayload` struct
- `PublishContext` struct
- `RenderConfig` struct
- `OutputFormat` enum
- `AdapterCapability` struct (with `Cow<'static, str>` fields per [RFC-0006:C-REGISTRAR-API](../rfc/RFC-0006.md#rfc-0006c-registrar-api))
- `AdapterRegistrar` struct and `AdapterFactory` type alias per [RFC-0006:C-REGISTRAR-API](../rfc/RFC-0006.md#rfc-0006c-registrar-api)

This crate MUST re-export from dependencies:
- From `typub-core`: `AssetStrategy`, `MathRendering`, `MathDelimiters`, `DraftSupport`, `CapabilitySupport`, `CapabilityGapBehavior`
- From semantic IR crate (`typub-html` at present): document IR surface required by adapters, including `Document`, `Block`, and `Inline` (or equivalent top-level semantic IR types defined by current RFC baseline)

This crate MUST NOT depend on:
- Main `typub` crate (no circular dependency)
- Any adapter implementation crate

**Rationale:**
A shared types crate provides a stable interface that both the main crate and adapter crates depend on. This avoids circular dependencies and enables third-party adapters to compile against a minimal dependency set. Re-exporting semantic document IR types (instead of legacy HTML-structured node vectors) aligns adapter boundaries with semantic IR v2 and reduces duplicated migration logic."""
