[[sections]]
title = "Specification"
clauses = [
    "clauses/C-SEMANTIC-BOUNDARY.toml",
    "clauses/C-ASSET-REFERENCE.toml",
    "clauses/C-MATH-MODEL.toml",
    "clauses/C-DOCUMENT-ROOT.toml",
    "clauses/C-ATTRS-LAYERING.toml",
    "clauses/C-RAW-UNKNOWN-POLICY.toml",
