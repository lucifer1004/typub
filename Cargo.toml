[workspace]
members = [
    ".",
    "crates/typub-engine",
    "crates/typub-tui",
    "crates/typub-core",
    "crates/typub-ir",
    "crates/typub-html",
    "crates/typub-passes",
    "crates/typub-markdown",
    "crates/typub-config",
    "crates/typub-storage",
    "crates/typub-adapters-core",
    "crates/typub-log",
    "crates/typub-ui",
    "crates/typub-theme",
    "crates/typub-assets-ast",
    # Adapter subcrates (per RFC-0007:C-WORKSPACE-LAYOUT)
    "crates/adapters/typub-adapter-ghost",
    "crates/adapters/typub-adapter-devto",
    "crates/adapters/typub-adapter-wordpress",
    "crates/adapters/typub-adapter-hashnode",
    "crates/adapters/typub-adapter-confluence",
    "crates/adapters/typub-adapter-astro",
    "crates/adapters/typub-adapter-static",
    "crates/adapters/typub-adapter-xiaohongshu",
    "crates/adapters/typub-adapter-notion",
    "crates/adapters/typub-adapter-copypaste",
]

# Common package metadata for all crates
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lucifer1004/typub"
homepage = "https://github.com/lucifer1004/typub"
keywords = ["typst", "publishing", "markdown", "content"]
categories = ["command-line-utilities", "text-processing"]

# Workspace-level dependencies for version consistency
# Implements [[ADR-0003]] workspace dependency unification
[workspace.dependencies]
anyhow = "1"
arboard = "3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
comrak = { version = "0.51", default-features = false }
crossterm = "0.29"
css-inline = "0.20"
dirs = "6"
dotenvy = "0.15"
enumset = "1"
hex = "0.4"
hmac = "0.12"
html2text = { version = "0.16" }
indicatif = "0.18"
insta = "1"
jwt = "0.16"
mime_guess = "2.0"
notify = "8"
open = "5"
owo-colors = "4"
ratatui = { version = "0.30" }
regex = "1"
relative-path = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-webpki-roots", "charset", "http2"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subst = "0.3"
tempfile = "3.25.0"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
tylax = "0.3"
url = "2"
urlencoding = "2"
usvg = "0.47"
resvg = "0.47"
tiny-skia = "0.12"
walkdir = "2"
wiremock = "0.6"

# Internal crates
typub-core = { path = "crates/typub-core", version = "0.1" }
typub-ir = { path = "crates/typub-ir", version = "0.1" }
typub-html = { path = "crates/typub-html", version = "0.1" }
typub-passes = { path = "crates/typub-passes", version = "0.1" }
typub-markdown = { path = "crates/typub-markdown", version = "0.1" }
typub-config = { path = "crates/typub-config", version = "0.1" }
typub-storage = { path = "crates/typub-storage", version = "0.1", default-features = false }
typub-adapters-core = { path = "crates/typub-adapters-core", version = "0.1", default-features = false }
typub-log = { path = "crates/typub-log", version = "0.1" }
typub-ui = { path = "crates/typub-ui", version = "0.1" }
typub-theme = { path = "crates/typub-theme", version = "0.1" }
typub-engine = { path = "crates/typub-engine", version = "0.1", default-features = false }
typub-tui = { path = "crates/typub-tui", version = "0.1", default-features = false }
typub-assets-ast = { path = "crates/typub-assets-ast", version = "0.1" }

# Adapter subcrates (per RFC-0007:C-WORKSPACE-LAYOUT)
typub-adapter-ghost = { path = "crates/adapters/typub-adapter-ghost", version = "0.1", default-features = false }
typub-adapter-devto = { path = "crates/adapters/typub-adapter-devto", version = "0.1", default-features = false }
typub-adapter-wordpress = { path = "crates/adapters/typub-adapter-wordpress", version = "0.1", default-features = false }
typub-adapter-hashnode = { path = "crates/adapters/typub-adapter-hashnode", version = "0.1", default-features = false }
typub-adapter-confluence = { path = "crates/adapters/typub-adapter-confluence", version = "0.1", default-features = false }
typub-adapter-astro = { path = "crates/adapters/typub-adapter-astro", version = "0.1", default-features = false }
typub-adapter-static = { path = "crates/adapters/typub-adapter-static", version = "0.1", default-features = false }
typub-adapter-xiaohongshu = { path = "crates/adapters/typub-adapter-xiaohongshu", version = "0.1", default-features = false }
typub-adapter-notion = { path = "crates/adapters/typub-adapter-notion", version = "0.1", default-features = false }
typub-adapter-copypaste = { path = "crates/adapters/typub-adapter-copypaste", version = "0.1", default-features = false }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "typub"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Universal publishing tool that converts Typst content to multiple platforms (Ghost, WordPress, Dev.to, Notion, etc.)"
include = [
    "/src/**",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/typub.template.toml",
]

[features]
default = ["s3"]
s3 = ["typub-engine/s3", "typub-storage/s3"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
dotenvy.workspace = true
notify.workspace = true
open.workspace = true
regex.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
typub-config.workspace = true
typub-core.workspace = true
typub-engine.workspace = true
typub-storage.workspace = true
typub-tui.workspace = true
typub-ui.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tokio.workspace = true
typub-adapter-astro.workspace = true
typub-adapter-confluence.workspace = true
typub-adapter-copypaste.workspace = true
typub-adapter-devto.workspace = true
typub-adapter-ghost.workspace = true
typub-adapter-notion.workspace = true
typub-adapter-wordpress.workspace = true
typub-adapters-core.workspace = true
typub-html.workspace = true
wiremock.workspace = true

[package.metadata.release]
pre-release-commit-message = "chore: release typub {{version}}"
