[package]
name = "typub-adapter-ghost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ghost platform adapter for typub"
include = [
    "src/**/*",
    "Cargo.toml",
]

[dependencies]
# Core adapter infrastructure
typub-adapters-core.workspace = true
typub-assets-ast.workspace = true
typub-core.workspace = true
typub-config.workspace = true
typub-html.workspace = true
typub-ir.workspace = true
typub-storage.workspace = true

# Async runtime
async-trait.workspace = true
