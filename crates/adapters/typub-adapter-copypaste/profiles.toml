# Built-in copy-paste platform profiles.
#
# Adding a new platform = one [[profile]] entry here.
# No Rust code change needed unless the platform requires special transforms.
#
# Fields:
#   id                               - unique platform identifier (used in typub.toml)
#   name                             - human-readable display name
#   short_code                       - 2-3 character code for compact display
#   editor_url                       - URL to the platform's article editor
#   format                           - "html" (styled rich text) or "markdown" (plain text)
#   serialize_rules                  - (optional) list of serialization rules to apply
#   default_theme                    - (optional) default theme for this profile (layer 5 in resolution)
#   default_asset_strategy           - (optional) default asset handling: "embed", "external" (defaults to "embed")
#   math_delimiters                  - (optional) math delimiter syntax: "dollar", "brackets", "brackets_inline_dollar_block"
#   math_rendering                   - (optional) how to render math: "svg", "png", "latex" (default: html=svg, markdown=latex)
#   use_inline_html_for_sized_images - (optional) use <img> tags for sized images in Markdown (default: false)
#
# Available serialize_rules:
#   li_span_wrap               - wrap <li> content in <span style="display:inline;">
#                                (needed for WeChat to prevent text splitting)
#   blockquote_for_admonition  - use <blockquote> instead of <div> for admonitions
#                                (needed for WeChat/Weibo which strip <div> tags)
#   sibling_nested_lists       - use sibling <ul>/<ol> instead of nested children of <li>
#                                (needed for WeChat which incorrectly transforms nested lists)
#   definition_list_to_paragraph - convert <dl> to <p><strong>Term</strong>: Definition</p>
#                                (needed for WeChat/Weibo which don't support <dl> tags)
#
# Asset strategies:
#   embed    - base64 data URIs (works for most platforms)
#   external - S3/R2 URLs (for platforms that reject base64 or have size limits)
#
# Math delimiters (for Markdown platforms):
#   dollar                        - $...$ for inline, $$...$$ for block (default)
#   brackets                      - \(...\) for inline, \[...\] for block
#   brackets_inline_dollar_block  - \(...\) for inline, $$...$$ for block (e.g., SegmentFault)
#
# use_inline_html_for_sized_images:
#   When true, images with width/height attributes are rendered as <img> tags in Markdown.
#   Standard Markdown doesn't support image dimensions. Enable for platforms that accept inline HTML.

# ---- StyledHtml platforms ----

[[profile]]
id = "wechat"
name = "WeChat Official Account"
short_code = "wx"
editor_url = "https://mp.weixin.qq.com"
format = "html"
serialize_rules = ["li_span_wrap", "blockquote_for_admonition", "sibling_nested_lists", "definition_list_to_paragraph"]
default_theme = "wechat-green"

