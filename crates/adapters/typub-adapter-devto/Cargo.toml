[package]
name = "typub-adapter-devto"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dev.to platform adapter for typub"
include = [
    "src/**/*",
    "Cargo.toml",
]

[features]
default = ["s3"]
s3 = ["typub-adapters-core/s3", "typub-storage/s3"]

[dependencies]
# Core adapter infrastructure
typub-adapters-core.workspace = true
typub-core.workspace = true
typub-config.workspace = true
typub-html.workspace = true
typub-ir.workspace = true
typub-storage.workspace = true

# Async runtime
async-trait.workspace = true
tokio.workspace = true

# HTTP client
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Date/time
chrono.workspace = true

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
